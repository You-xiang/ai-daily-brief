name: AI Daily Brief
on:
  schedule:
    # UTC 1:00 = 北京时间 9:00（GitHub Actions 定时器只认 UTC）
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests feedparser

      - name: Generate daily brief
        env:
          CTYUN_API_KEY: ${{ secrets.CTYUN_API_KEY }}
          CTYUN_MODEL: ${{ secrets.CTYUN_MODEL }}
          CTYUN_BASE_URL: ${{ secrets.CTYUN_BASE_URL }}
        run: python scripts/generate_brief.py

      - name: Push notification (optional)
        env:
          SC_KEY: ${{ secrets.SC_KEY }}
          PAGE_URL: ${{ secrets.PAGE_URL }}
        run: python scripts/push_notify.py

      - name: Commit updated brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/brief.txt
          git commit -m "daily brief $(date +%F)" || echo "no changes"
          git push
