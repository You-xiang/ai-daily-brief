<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 行业每日简报</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f5f7fa; color:#333; line-height:1.7; }
.wrap { max-width:680px; margin:0 auto; padding:16px 14px 40px; }
.header { background:linear-gradient(135deg,#0066cc,#004999); color:#fff; border-radius:12px; padding:24px 18px; text-align:center; }
.header h1 { font-size:20px; margin-bottom:6px; }
.header p { font-size:13px; opacity:.85; }
.tip { background:#fff8e6; border:1px solid #f0d896; border-radius:10px; padding:14px 16px; margin-top:14px; font-size:13px; color:#8a6d1a; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>AI 行业每日简报</h1>
    <p>每天 09:00 自动更新 · GitHub Actions 驱动</p>
  </div>
  <div class="tip">
    <b>首次部署提示</b>：本页面将在第一次自动任务运行后显示每日简报内容。<br><br>
    如果你现在看到这个页面，说明部署已生效，等明早 9 点后刷新即可看到当天简报；也可以到仓库 Actions 页面手动点击 "Run workflow" 立即生成一次。
  </div>
</div>
</body>
</html>
